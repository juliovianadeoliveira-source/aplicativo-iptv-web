name: Build JSTech Auto TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-auto-tv/**"
      - ".github/workflows/build-auto-tv-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android-auto-tv
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-auto-tv/app/build/outputs/apk/debug/app-debug.apk JSTech-Auto-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JSTech-Auto-TV
          path: JSTech-Auto-TV.apk
