name: Build Aurora Apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aurora-browser/**'
      - '.github/workflows/build-aurora-apps.yml'
concurrency:
  group: aurora-apps-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aurora-browser/desktop/package-lock.json
      - name: Install locked dependencies
        working-directory: aurora-browser/desktop
        run: npm ci --no-audit --no-fund
      - name: Test browser policies
        working-directory: aurora-browser/desktop
        run: npm test
      - name: Smoke test browser engine
        working-directory: aurora-browser/desktop
        env:
          AURORA_SMOKE_TEST: '1'
        run: npx electron .
      - name: Build installer and portable executable
        working-directory: aurora-browser/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows
          path: aurora-browser/desktop/dist/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test Android browser policies
        run: |
          mkdir -p /tmp/aurora-java-tests
          javac -d /tmp/aurora-java-tests aurora-browser/android/app/src/main/java/com/aurora/browser/BrowserPolicy.java aurora-browser/tests/BrowserPolicyTest.java
          java -cp /tmp/aurora-java-tests BrowserPolicyTest
      - name: Install Android platform
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build preview APK
        working-directory: aurora-browser/android
        run: gradle assembleDebug --no-daemon
      - name: Name APK
        run: cp aurora-browser/android/app/build/outputs/apk/debug/app-debug.apk Aurora-Android-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android
          path: Aurora-Android-0.1.0.apk
          if-no-files-found: error
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Aurora-*
          path: release-files
          merge-multiple: true
      - name: Create checksums
        working-directory: release-files
        run: sha256sum *.exe *.apk > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view aurora-v0.1.0 >/dev/null 2>&1; then
            gh release create aurora-v0.1.0 --target "$GITHUB_SHA" --title 'Aurora 0.1.0 — prévia para Windows e Android' --prerelease --notes-file aurora-browser/README.md
          fi
          gh release upload aurora-v0.1.0 release-files/* --clobber
