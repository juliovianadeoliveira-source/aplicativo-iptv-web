<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7357ff">
<meta name="description" content="IPTV Player Web para listas compatíveis com Xtream Codes">
<title>IPTV Player - Login</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="background-glow"></div>
<main class="login-container">
<section class="login-card">
<div class="logo"><div class="logo-icon">▶</div><div><h1>IPTV<span>PLAYER</span></h1><p>Seu entretenimento em um só lugar</p></div></div>
<div class="login-title"><h2>Entrar</h2><p>Conecte sua lista para continuar</p></div>
<form id="loginForm">
<div class="input-group"><label for="server">URL do servidor</label><div class="input-box"><span>🌐</span><input type="url" id="server" placeholder="https://seu-servidor.com" autocomplete="url" required></div></div>
<div class="input-group"><label for="username">Usuário</label><div class="input-box"><span>👤</span><input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" required></div></div>
<div class="input-group"><label for="password">Senha</label><div class="input-box"><span>🔒</span><input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required><button type="button" class="show-password" id="showPassword">👁</button></div></div>
<div class="login-options"><label class="remember"><input type="checkbox" id="remember"><span>Manter conectado</span></label></div>
<button type="submit" class="login-button" id="loginButton"><span>ENTRAR</span><strong>→</strong></button>
<div id="loginMessage" class="login-message"></div>
</form>
<div class="login-footer"><span>IPTV PLAYER</span><small>Aplicativo Web</small></div>
</section>
</main>
<script src="config.js"></script>
<script src="app.js?v=20260822-4"></script>
<script type="module" src="js/bootstrap.js?v=2"></script>
</body>
</html>
