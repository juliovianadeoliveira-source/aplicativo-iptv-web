services:
  postgres:
    image: postgres:15-alpine
    container_name: jstech_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD:__REDACTED__
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jstech_evolution_redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: jstech_evolution_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - evolution.env
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "127.0.0.1:8090:8080"

  n8n:
    image: n8nio/n8n:latest
    container_name: jstech_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.51-79-39-182.sslip.io
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.51-79-39-182.sslip.io/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY:__REDACTED__
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_CAMPAIGN_TOKEN:__REDACTED__
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY:__REDACTED__
      EVOLUTION_INSTANCE: JSTech
      BULK_QUEUE_TOKEN:__REDACTED__
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  caddy:
    image: caddy:2-alpine
    container_name: jstech_automation_caddy
    restart: unless-stopped
    depends_on:
      - evolution-api
      - n8n
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  evolution_postgres:
  evolution_redis:
  evolution_instances:
  n8n_data:
  caddy_data:
  caddy_config: